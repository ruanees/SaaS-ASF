name: asf-back

on:
  push:
    branches: [main]
    paths: ['asf-back/**', '.github/workflows/back.yml']
  pull_request:
    paths: ['asf-back/**', '.github/workflows/back.yml']

concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: asf-back

jobs:
  app:
    name: Nest (tipos, lint, testes, build, openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: asf-back/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      # O mesmo comando que a Cloudflare roda na publicação.
      - run: npm run build
      - run: npm run openapi
      - run: npm audit --omit=dev --audit-level=high

  banco:
    name: Banco (migrações + provas pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Versão fixa, igual à do package.json: 'latest' consulta a API do GitHub
          # e falha por limite de requisições.
          version: 2.121.0
      # Sobe só o Postgres local, aplica todas as migrações e o seed do zero.
      - run: supabase db start
      - run: supabase db reset --local
      # Provas de RLS e regras (supabase/tests).
      - run: supabase test db
      # Avisos do linter do Supabase (security definer sem search_path etc.).
      - run: supabase db lint --level warning --fail-on warning

  worker:
    name: Worker (empacota e sobe no workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: asf-back/package-lock.json
      - run: npm ci
      # Empacota como a publicação faria (build do Nest + bundle do wrangler).
      - run: npx wrangler deploy --dry-run --outdir .wrangler/saida
        env:
          WRANGLER_SEND_METRICS: 'false'
      # Sobe o Worker no runtime da Cloudflare e prova que o Nest responde.
      - name: Sobe no workerd e chama /saude, /openapi.json e /eu
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/saude > saude.json && break
            sleep 2
          done
          cat saude.json || { cat wrangler.log; exit 1; }
          grep -q '"situacao":"ok"' saude.json
          curl -sf http://localhost:8787/openapi.json | grep -q '"/eu"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/eu)" = "401"

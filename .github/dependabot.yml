version: 2
updates:
  - package-ecosystem: npm
    directory: /asf-back
    schedule:
      interval: weekly
    groups:
      nest:
        patterns: ['@nestjs/*']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /asf-front
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom']
    open-pull-requests-limit: 5

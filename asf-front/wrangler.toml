# Worker do front (Next.js pelo @opennextjs/cloudflare) — ADR 0008.
# Configuração só aqui: o painel da Cloudflare é sobrescrito a cada deploy.

name = "asf-front"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Endereço do back publicado. Trocar pelo endereço real quando o asf-back
# estiver na Cloudflare (ou pelo domínio próprio).
API_URL = "https://asf-back.SEU-SUBDOMINIO.workers.dev"
# Usado também no build, para a CSP: configurar igual nas variáveis de build
# do Workers Builds.
SUPABASE_URL = "https://dfpaflwwqyphmpxxbsad.supabase.co"

[observability]
enabled = true
